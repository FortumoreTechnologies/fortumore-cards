<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Card — Fortumore Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-text {
            background: linear-gradient(90deg, #94a3b8 0%, #ffffff 50%, #94a3b8 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes pulse-subtle {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.95; }
        }
        .floating-whatsapp {
            position: fixed;
            bottom: 16px;
            right: 16px;
            z-index: 50;
            animation: pulse-subtle 3s infinite ease-in-out;
            box-shadow: 0 6px 20px -4px rgba(34, 197, 94, 0.4);
            transition: all 0.3s ease;
        }
        .floating-whatsapp:hover {
            transform: scale(1.06);
            box-shadow: 0 10px 25px -4px rgba(34, 197, 94, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-blue-500 selection:text-white">

    <div id="card-container" class="w-full max-w-md space-y-6">
        <!-- Premium Loading Animation State -->
        <div class="text-center py-24 space-y-4 bg-slate-900/40 border border-slate-800/80 rounded-3xl backdrop-blur-xl shadow-2xl">
            <div class="relative w-16 h-16 mx-auto">
                <div class="absolute inset-0 rounded-full bg-blue-500/20 animate-ping"></div>
                <div class="relative w-full h-full rounded-full border-2 border-blue-500/40 border-t-blue-400 animate-spin flex items-center justify-center">
                    <i class="fa-solid fa-bolt text-blue-400 text-sm"></i>
                </div>
            </div>
            <div class="space-y-1">
                <h2 class="text-xl font-bold tracking-tight shimmer-text">Fortumore Elite</h2>
                <p class="text-xs text-slate-400 font-medium tracking-widest uppercase">Loading Profile...</p>
            </div>
        </div>
    </div>

    <!-- Persistent Tiny Floating WhatsApp Widget Container -->
    <div id="floating-whatsapp-container"></div>

    <script>
        const fallbackUserData = {
            "name": "I.C GABRIEL",
            "title": "Automation Engineer & Tech Strategist",
            "company": "Fortumore Technologies",
            "location": "Abuja, Nigeria",
            "tagline": "Building scalable workflow automations, SaaS solutions, and digital systems across Africa.",
            "phone": "+2348107728594",
            "whatsapp": "2348107728594",
            "email": "fortumoregroup.ng@gmail.com",
            "mapUrl": "https://maps.google.com/?q=Abuja,Nigeria",
            "portfolioPdf": "https://example.com/gabriel-portfolio.pdf",
            "image": "images/gabriel.jpg",
            "themeColor": "#3b82f6",
            "secondaryColor": "#6366f1",
            "sections": [],
            "socials": {}
        };

        async function loadCard() {
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('user') || 'chibuzor';
            const container = document.getElementById('card-container');
            const whatsappContainer = document.getElementById('floating-whatsapp-container');
            
            let user;
            try {
                const response = await fetch(`users/${username}.json`);
                if (!response.ok) throw new Error("Profile not found on server");
                user = await response.json();
            } catch (err) {
                console.warn("Using fallback local profile data due to fetch error:", err);
                user = fallbackUserData;
            }

            try {
                document.title = `${user.name} — Digital Card`;
                const primaryColor = user.themeColor || '#3b82f6';
                const secondaryColor = user.secondaryColor || '#6366f1';

                // Render tiny, compact floating WhatsApp widget
                if (user.whatsapp) {
                    const encodedMsg = encodeURIComponent(`Interesting ${user.name}, am impressed when do we begin?`);
                    whatsappContainer.innerHTML = `
                        <a href="https://wa.me/${user.whatsapp}?text=${encodedMsg}" 
                           target="_blank" 
                           class="floating-whatsapp flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-full font-medium text-xs backdrop-blur-md border border-emerald-400/30 cursor-pointer shadow-xl">
                            <div class="relative flex items-center justify-center">
                                <span class="absolute w-2.5 h-2.5 bg-white rounded-full animate-ping opacity-75"></span>
                                <i class="fa-brands fa-whatsapp text-base text-white relative"></i>
                            </div>
                            <span class="font-medium tracking-tight pr-0.5">Chat</span>
                        </a>
                    `;
                }

                let html = `
                    <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl backdrop-blur-xl relative overflow-hidden">
                        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                        <div class="relative w-28 h-28 mx-auto mb-4 mt-2">
                            <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-[${primaryColor}] to-[${secondaryColor}] animate-pulse opacity-75"></div>
                            <img src="${user.image || 'images/gabriel.jpg'}" alt="${user.name}" class="relative w-full h-full object-cover rounded-full border-2 border-slate-700 shadow-md" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=600'">
                        </div>
                        <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-1.5">
                            ${user.name} 
                            <i class="fa-solid fa-circle-check text-sm" style="color: ${primaryColor};" title="Verified Professional"></i>
                        </h1>
                        <p class="font-medium text-sm mt-1" style="color: ${primaryColor};">${user.title} ${user.company ? '• ' + user.company : ''}</p>
                        <p class="text-slate-400 text-xs mt-1 flex items-center justify-center gap-1"><i class="fa-solid fa-location-dot"></i>${user.location}</p>
                        <p class="text-slate-300 text-sm mt-3 leading-relaxed px-2">${user.tagline}</p>
                        
                        <!-- Top Action Grid -->
                        <div class="grid grid-cols-5 gap-2 mt-6">
                            <a href="tel:${user.phone}" class="flex flex-col items-center justify-center bg-slate-800/90 hover:bg-slate-700 p-2.5 rounded-2xl transition border border-slate-700/50 text-[11px] font-medium text-slate-200 group">
                                <i class="fa-solid fa-phone text-sm mb-1 group-hover:scale-110 transition-transform" style="color: ${primaryColor};"></i> Call
                            </a>
                            <a href="https://wa.me/${user.whatsapp}" target="_blank" class="flex flex-col items-center justify-center bg-slate-800/90 hover:bg-slate-700 p-2.5 rounded-2xl transition border border-slate-700/50 text-[11px] font-medium text-slate-200 group">
                                <i class="fa-brands fa-whatsapp text-green-400 text-sm mb-1 group-hover:scale-110 transition-transform"></i> WhatsApp
                            </a>
                            <a href="mailto:${user.email}" class="flex flex-col items-center justify-center bg-slate-800/90 hover:bg-slate-700 p-2.5 rounded-2xl transition border border-slate-700/50 text-[11px] font-medium text-slate-200 group">
                                <i class="fa-solid fa-envelope text-sm mb-1 group-hover:scale-110 transition-transform" style="color: ${secondaryColor};"></i> Email
                            </a>
                            <a href="${user.mapUrl}" target="_blank" class="flex flex-col items-center justify-center bg-slate-800/90 hover:bg-slate-700 p-2.5 rounded-2xl transition border border-slate-700/50 text-[11px] font-medium text-slate-200 group">
                                <i class="fa-solid fa-map-location-dot text-amber-400 text-sm mb-1 group-hover:scale-110 transition-transform"></i> Map
                            </a>
                            <button onclick="sharePlatform()" class="flex flex-col items-center justify-center bg-slate-800/90 hover:bg-slate-700 p-2.5 rounded-2xl transition border border-slate-700/50 text-[11px] font-medium text-slate-200 cursor-pointer group">
                                <i class="fa-solid fa-share-nodes text-sm mb-1 group-hover:scale-110 transition-transform" style="color: ${primaryColor};"></i> Share
                            </button>
                        </div>
                    </div>
                `;

                if (user.sections && Array.isArray(user.sections)) {
                    user.sections.forEach(sec => {
                        html += `
                            <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-5 shadow-xl space-y-4 backdrop-blur-md">
                                <h2 class="font-bold tracking-wide text-sm flex items-center" style="color: ${primaryColor};">
                                    <span class="opacity-70 mr-2">${sec.number}</span> — ${sec.title}
                                </h2>
                        `;

                        if (sec.type === 'about') {
                            html += `<p class="text-slate-300 text-sm leading-relaxed">${sec.content}</p>`;
                        } else if (sec.type === 'expertise') {
                            sec.groups.forEach(g => {
                                html += `
                                    <div class="mt-3">
                                        <h3 class="text-slate-200 font-semibold text-xs uppercase tracking-wider mb-2">${g.category}</h3>
                                        <ul class="space-y-1.5">
                                `;
                                g.items.forEach(item => {
                                    html += `
                                        <li class="text-slate-400 text-sm flex items-center">
                                            <i class="fa-solid fa-circle text-[6px] mr-2" style="color: ${primaryColor};"></i>${item}
                                        </li>
                                    `;
                                });
                                html += `</ul></div>`;
                            });
                        } else if (sec.type === 'projects') {
                            if (sec.items && Array.isArray(sec.items)) {
                                sec.items.forEach(p => {
                                    html += `
                                        <div class="bg-slate-950/60 border border-slate-800/80 rounded-2xl overflow-hidden mt-3 shadow-inner">
                                            <img src="${p.image || 'https://images.unsplash.com/photo-1551288049-bebda4e38f71'}" alt="${p.projectName || 'Project'}" class="w-full h-40 object-cover" onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=Project+Preview'">
                                            <div class="p-4 space-y-2">
                                                <h3 class="font-bold text-slate-100 text-base">${p.projectName || ''}</h3>
                                                ${p.location ? `<p class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-location-dot"></i>${p.location}</p>` : ''}
                                                ${p.role ? `<p class="text-xs text-slate-300"><strong class="text-slate-200">Role:</strong> ${p.role}</p>` : ''}
                                                ${p.insight ? `<p class="text-xs text-slate-400"><strong class="text-slate-200">Impact:</strong> ${p.insight}</p>` : ''}
                                            </div>
                                        </div>
                                    `;
                                });
                            }
                        } else if (sec.type === 'videos') {
                            if (sec.items && Array.isArray(sec.items)) {
                                sec.items.forEach(v => {
                                    html += `
                                        <div class="bg-slate-950/60 border border-slate-800/80 rounded-2xl overflow-hidden mt-3 shadow-inner">
                                            <div class="relative w-full aspect-video bg-black">
                                                <iframe src="${v.videoUrl}" class="w-full h-full border-0" allowfullscreen title="${v.videoName || 'Embedded Video'}"></iframe>
                                            </div>
                                            <div class="p-4 space-y-2">
                                                <h3 class="font-bold text-slate-100 text-base">${v.videoName || ''}</h3>
                                                ${v.platform ? `<p class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-video" style="color: ${primaryColor};"></i>Platform: ${v.platform}${v.duration ? '• ' + v.duration : ''}</p>` : ''}
                                                ${v.description ? `<p class="text-xs text-slate-300"><strong class="text-slate-200">Details:</strong> ${v.description}</p>` : ''}
                                            </div>
                                        </div>
                                    `;
                                });
                            }
                        } else if (sec.type === 'table') {
                            html += `
                                <p class="text-xs text-slate-400">${sec.description}</p>
                                <div class="overflow-x-auto mt-2">
                                    <table class="w-full text-left text-xs text-slate-300 border-collapse">
                                        <thead>
                                            <tr class="border-b border-slate-800 text-slate-400">
                            `;
                            sec.headers.forEach(h => html += `<th class="py-2 px-3 font-semibold">${h}</th>`);
                            html += `</tr></thead><tbody>`;
                            sec.rows.forEach(row => {
                                html += `<tr class="border-b border-slate-800/50 hover:bg-slate-800/20">`;
                                row.forEach(cell => html += `<td class="py-2 px-3">${cell}</td>`);
                                html += `</tr>`;
                            });
                            html += `</tbody></table></div>`;
                        }

                        html += `</div>`;
                    });
                }

                html += `
                    <div class="space-y-3 pt-2 pb-2">
                        ${user.portfolioPdf ? `
                            <a href="${user.portfolioPdf}" target="_blank" class="w-full flex items-center justify-center text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition text-sm hover:opacity-90 transform hover:-translate-y-0.5" style="background: linear-gradient(to right, ${primaryColor},${secondaryColor});">
                                <i class="fa-solid fa-file-arrow-down mr-2 text-base"></i> Download Complete Portfolio (PDF)
                            </a>
                        ` : ''}
                        <button onclick="downloadVCard('${username}')" class="w-full flex items-center justify-center bg-slate-900 border border-slate-700 hover:bg-slate-800 text-slate-100 font-semibold py-3.5 px-4 rounded-2xl shadow-lg transition text-sm cursor-pointer">
                            <i class="fa-solid fa-address-book mr-2 text-base" style="color: ${primaryColor};"></i> Save Contact to Phonebook
                        </button>
                    </div>
                `;

                if (user.socials && Object.keys(user.socials).length > 0) {
                    html += `
                        <div class="flex justify-center items-center gap-3 pb-2">
                            ${user.socials.linkedin ? `<a href="${user.socials.linkedin}" target="_blank" class="w-10 h-10 flex items-center justify-center bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-full text-slate-300 hover:text-white transition shadow"><i class="fa-brands fa-linkedin-in text-sm"></i></a>` : ''}
                            ${user.socials.facebook ? `<a href="${user.socials.facebook}" target="_blank" class="w-10 h-10 flex items-center justify-center bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-full text-slate-300 hover:text-white transition shadow"><i class="fa-brands fa-facebook-f text-sm"></i></a>` : ''}
                            ${user.socials.instagram ? `<a href="${user.socials.instagram}" target="_blank" class="w-10 h-10 flex items-center justify-center bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-full text-slate-300 hover:text-white transition shadow"><i class="fa-brands fa-instagram text-sm"></i></a>` : ''}
                            ${user.socials.tiktok ? `<a href="${user.socials.tiktok}" target="_blank" class="w-10 h-10 flex items-center justify-center bg-slate-900 border border-slate-800 hover:bg-slate-800 rounded-full text-slate-300 hover:text-white transition shadow"><i class="fa-brands fa-tiktok text-sm"></i></a>` : ''}
                        </div>
                    `;
                }

                html += `
                    <div class="text-center text-xs text-slate-500 pb-4 font-medium tracking-wide">
                        Powered By Fortumore
                    </div>
                `;

                container.innerHTML = html;
            } catch (err) {
                console.error("Error rendering card data:", err);
                container.innerHTML = `
                    <div class="text-center py-16 text-red-400 font-semibold bg-slate-900/50 border border-slate-800 rounded-3xl p-6 shadow-xl">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>Oops! This profile encountered a rendering error. Please check your data structure.</p>
                    </div>
                `;
            }
        }

        async function sharePlatform() {
            const currentUrl = window.location.href;
            const shareData = {
                title: 'Digital Business Card',
                text: 'Check out this professional digital business card:',
                url: currentUrl
            };
            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.log('Share canceled or failed', err);
                }
            } else {
                showToast('Card link copied to clipboard!');
            }
        }

        function showToast(message) {
            const existing = document.getElementById('toast-notification');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'toast-notification';
            toast.className = 'fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-900 text-slate-100 px-4 py-2.5 rounded-xl border border-slate-700 shadow-2xl text-xs z-50 flex items-center gap-2 animate-bounce';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-blue-400"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        async function downloadVCard(username) {
            try {
                let u = fallbackUserData;
                try {
                    const res = await fetch(`users/${username}.json`);
                    if (res.ok) u = await res.json();
                } catch(e) {}

                const vcard = `BEGIN:VCARD
VERSION:3.0
FN:${u.name}
TITLE:${u.title}
ORG:${u.company || ''}
TEL;TYPE=WORK,VOICE:${u.phone}
EMAIL:${u.email}
NOTE:${u.tagline}
END:VCARD`;
                const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${u.name.replace(/\s+/g, '_')}.vcf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('Contact saved to your device!');
            } catch (err) {
                console.error("Error generating vCard:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', loadCard);
    </script>
</body>
</html>
