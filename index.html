<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-4">

    <div id="card-container" class="bg-white w-full max-w-md p-6 rounded-3xl shadow-2xl text-center relative overflow-hidden">
        <div class="animate-pulse flex flex-col items-center py-12">
            <div class="rounded-full bg-slate-200 h-28 w-28 mb-4"></div>
            <div class="h-6 bg-slate-200 rounded w-3/4 mb-2"></div>
            <div class="h-4 bg-slate-200 rounded w-1/2"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user') || 'david';

        fetch('users.json')
            .then(response => response.json())
            .then(database => {
                const data = database[username];
                const container = document.getElementById('card-container');

                if (!data) {
                    container.innerHTML = `
                        <div class="py-12">
                            <i class="fa-solid fa-triangle-exclamation text-amber-500 text-4xl mb-3"></i>
                            <h2 class="text-xl font-bold text-slate-800">Card Not Found</h2>
                            <p class="text-slate-500 text-sm mt-1">This digital profile does not exist.</p>
                        </div>`;
                    return;
                }

                let portfolioHtml = '';
                if (data.portfolioImages && data.portfolioImages.length > 0) {
                    data.portfolioImages.forEach(img => {
                        portfolioHtml += `
                            <div class="overflow-hidden rounded-xl shadow-sm border border-slate-100 aspect-square">
                                <img src="${img}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                            </div>`;
                    });
                }

                container.innerHTML = `
                    <div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
                    <div class="relative z-10 mt-10">
                        <img src="${data.avatarUrl}" class="w-28 h-28 rounded-full mx-auto object-cover border-4 border-white shadow-lg">
                    </div>
                    <h1 class="text-2xl font-bold mt-3 text-slate-900">${data.fullName}</h1>
                    <p class="text-blue-600 font-semibold text-sm mt-0.5">${data.jobTitle}</p>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wider">${data.company}</p>
                    <p class="text-slate-600 text-sm mt-3 px-2 leading-relaxed">${data.bio}</p>

                    <div class="grid grid-cols-2 gap-3 mt-6">
                        <a href="tel:${data.phone}" class="flex items-center justify-center gap-2 bg-blue-50 text-blue-700 py-3 rounded-2xl font-semibold text-sm shadow-sm hover:bg-blue-100 transition">
                            <i class="fa-solid fa-phone"></i> Call
                        </a>
                        <a href="https://wa.me/${data.whatsapp}" target="_blank" class="flex items-center justify-center gap-2 bg-emerald-50 text-emerald-700 py-3 rounded-2xl font-semibold text-sm shadow-sm hover:bg-emerald-100 transition">
                            <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp
                        </a>
                        <a href="mailto:${data.email}" class="flex items-center justify-center gap-2 bg-slate-100 text-slate-700 py-3 rounded-2xl font-semibold text-sm shadow-sm hover:bg-slate-200 transition">
                            <i class="fa-solid fa-envelope"></i> Email
                        </a>
                        <a href="${data.mapLocation}" target="_blank" class="flex items-center justify-center gap-2 bg-amber-50 text-amber-700 py-3 rounded-2xl font-semibold text-sm shadow-sm hover:bg-amber-100 transition">
                            <i class="fa-solid fa-location-dot"></i> Location
                        </a>
                    </div>

                    <button onclick="downloadVCard('${data.fullName}', '${data.phone}', '${data.email}', '${data.company}')" class="w-full mt-3 bg-blue-600 text-white py-3.5 rounded-2xl font-bold text-sm shadow-md hover:bg-blue-700 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Save Contact to Phone
                    </button>

                    <div class="mt-8 text-left">
                        <h3 class="font-bold text-slate-800 text-sm uppercase tracking-wider mb-3 flex items-center gap-2">
                            <i class="fa-solid fa-briefcase text-blue-600"></i> Featured Portfolio
                        </h3>
                        <div class="grid grid-cols-3 gap-2">
                            ${portfolioHtml}
                        </div>
                    </div>

                    <div class="mt-8 pt-4 border-t border-slate-100 text-center">
                        <p class="text-[11px] text-slate-400 font-medium">Powered by <span class="font-bold text-slate-600">Digital Cards</span></p>
                    </div>
                `;
            });

        function downloadVCard(name, phone, email, company) {
            const vcardData = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${company}\nTEL:${phone}\nEMAIL:${email}\nEND:VCARD`;
            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name.replace(/\s+/g, '_')}.vcf`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
